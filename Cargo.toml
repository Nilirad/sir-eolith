[package]
name = "sir-eolith"
version = "0.1.0"
authors = ["Federico Rinaldi <gisquerin@gmail.com>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ggez = "0.5.1"
legion = { git = "https://github.com/TomGillen/legion" }
websocket = { git = "https://github.com/Nilirad/rust-websocket", branch = "feat/ignore-sec-websocket-accept" }
crossbeam-channel = "0.4.2"
num_enum = "0.5.0"
derive_more = "0.99.7"
log = "0.4.8"
env_logger = "0.7.1"
serde = { version = "1.0.111", features = ["derive"] }
serde_json = "1.0.53"