[package]
name = "connections"
version = "0.1.0"
authors = ["Federico Rinaldi <gisquerin@gmail.com>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
log = "0.4.8"
client = { path = "../client" }
websocket = { git = "https://github.com/Nilirad/rust-websocket", branch = "feat/ignore-sec-websocket-accept" }
crossbeam-channel = "0.4.2"
serde = { version = "1.0.111", features = ["derive"] }
serde_json = "1.0.53"
base64 = "0.12.1"